version: "3.9"

services:
  postgres:
    env_file: /etc/secrets/app.env
    image: postgres:16
    container_name: moveenglish-postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U move_user -d moveenglish"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    env_file: /etc/secrets/app.env
    build: .
    container_name: moveenglish-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
