version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: moveenglish-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_USER}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U move_user -d moveenglish"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: moveenglish-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      DB_USERNAME: move_user
      DB_PASSWORD: move_pass
      BOT_NAME: ${BOT_NAME}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_ADMIN_ID: ${BOT_ADMIN_ID}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
